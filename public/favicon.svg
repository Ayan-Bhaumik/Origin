  <style>:root{--signal:#6366F1}@media(prefers-color-scheme:dark){:root{--signal:#818CF8}}</style>
  <defs>
    <radialGradient id="glow" cx="25" cy="39" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".28"/>
